<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Tools - Remote Desktop</title>
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: #2c2c2c;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
        }
        .toolbar {
            background: #f8f9fa;
            padding: 5px 12px;
            display: flex;
            gap: 8px;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }
        button {
            background: #e2e6ea;
            color: #333;
            border: 1px solid #ced4da;
            padding: 4px 10px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #dae0e5; }
        button.disconnect-btn { background: #f8d7da; color: #721c24; border-color: #f5c6cb; }
        button.connect-btn { background: #d4edda; color: #155724; border-color: #c3e6cb; }

        #screen-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: default;
        }

        #screen-container.hide-cursor {
            cursor: none !important;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        #center-overlay {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: rgba(0,0,0,0.85);
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* Professional lokal kursor dizayni (kechikishni yo'qotish uchun) */
        #local-cursor {
            position: fixed;
            width: 16px;
            height: 16px;
            pointer-events: none;
            z-index: 99999;
            display: none;
            transform: translate(0, 0);
        }
    </style>
</head>
<body>

    <!-- Maxsus lokal kursor elementi -->
    <div id="local-cursor">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="white" stroke="black" stroke-width="1.5">
            <polygon points="0,0 0,18 5,13 11,22 14,20 8,11 16,11"></polygon>
        </svg>
    </div>

    <header>
        <h3 style="margin:0; color:#fff; font-size: 16px;">Admin Tools <span style="font-size: 11px; color: #aaa;">In God We trust!</span></h3>
        <div id="status-top" style="color: #28a745; font-weight: bold; font-size: 13px;">Ожидание агента...</div>
    </header>

    <div class="toolbar">
        <button id="main-action-btn" class="connect-btn" onclick="toggleConnection()" style="display: none;">Подключить</button>
        <button id="status-badge" disabled style="background: #f8d7da; color: #721c24; border-color: #f5c6cb; padding: 4px 10px; font-size: 13px; border-radius: 4px; font-weight: bold; cursor: default;">Отключен</button>
        
        <span id="sessionTimer" style="font-weight: bold; color: #333; background: #e2e6ea; padding: 4px 8px; border-radius: 4px; border: 1px solid #ced4da; font-size: 13px;">00:00:00</span>
        <span id="viewerCount" style="font-weight: bold; color: #333; background: #e2e6ea; padding: 4px 8px; border-radius: 4px; border: 1px solid #ced4da; font-size: 13px;">Смотрят: 1</span>

        <button onclick="toggleFullScreen()" style="margin-left: auto;">Полноэкранный</button>
    </div>

    <div id="screen-container">
        <div id="center-overlay">
            <h2 id="overlay-msg" style="color: #fff; font-size: 20px;">Поиск агента на компьютере...</h2>
        </div>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <script>
        const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const wsUrl = wsProtocol + window.location.host;
        let ws;
        let pc;
        let dataChannel;
        let localStream = null;
        let isConnected = false;

        let timerInterval = null;
        let secondsElapsed = 0;

        function startSessionTimer() {
            stopSessionTimer();
            secondsElapsed = 0;
            const timerElement = document.getElementById('sessionTimer');
            
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const hrs = Math.floor(secondsElapsed / 3600).toString().padStart(2, '0');
                const mins = Math.floor((secondsElapsed % 3600) / 60).toString().padStart(2, '0');
                const secs = (secondsElapsed % 60).toString().padStart(2, '0');
                timerElement.innerText = `${hrs}:${mins}:${secs}`;
            }, 1000);
        }

        function stopSessionTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            document.getElementById('sessionTimer').innerText = '00:00:00';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('c');
        const isAgentMode = window.location.hash === '#agent';

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' },
                { urls: 'stun:stun4.l.google.com:19302' },
                { urls: 'stun:stun.services.mozilla.com' },
                {
                    urls: 'turn:138.124.71.22:3478',
                    username: 'admin',
                    credential: 'supersecret123'
                }
            ],
            iceTransportPolicy: 'all'
        };

        const screenContainer = document.getElementById('screen-container');
        const remoteVideo = document.getElementById('remoteVideo');
        const localCursor = document.getElementById('local-cursor');

        let lastMouseX = 0;
        let lastMouseY = 0;

        function sendInput(data) {
            if (dataChannel && dataChannel.readyState === 'open') {
                dataChannel.send(JSON.stringify(data));
            }
        }

        // 100% Aniq koordinata va zudlik bilanharakatlanuvchi lokal kursor
        screenContainer.addEventListener('mousemove', (e) => {
            if (!isConnected) return;
            const rect = remoteVideo.getBoundingClientRect();
            
            // Agar sichqoncha video doirasidan tashqarida bo'lsa
            if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) {
                localCursor.style.display = 'none';
                return;
            }

            // Lokal kursorni darhol siljitamiz (kechikishni yo'qotish uchun)
            localCursor.style.display = 'block';
            localCursor.style.left = e.clientX + 'px';
            localCursor.style.top = e.clientY + 'px';

            // Faqat video o'lchamiga qarab 0.0 dan 1.0 gacha aniq nisbatni hisoblaymiz (1 mm ham adashmaydi)
            lastMouseX = (e.clientX - rect.left) / rect.width;
            lastMouseY = (e.clientY - rect.top) / rect.height;

            sendInput({ action: 'mousemove', x: lastMouseX, y: lastMouseY });
        });

        screenContainer.addEventListener('mousedown', (e) => {
            if (!isConnected) return;
            const rect = remoteVideo.getBoundingClientRect();
            if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) return;
            sendInput({ action: 'mousedown', button: e.button });
        });

        screenContainer.addEventListener('mouseup', (e) => {
            if (!isConnected) return;
            sendInput({ action: 'mouseup', button: e.button });
        });

        screenContainer.addEventListener('contextmenu', (e) => e.preventDefault());

        window.addEventListener('keydown', (e) => {
            if (!isConnected) return;
            sendInput({ action: 'keydown', key: e.key, code: e.code });
        });

        window.addEventListener('keyup', (e) => {
            if (!isConnected) return;
            sendInput({ action: 'keyup', key: e.key, code: e.code });
        });

        function init() {
            ws = new WebSocket(wsUrl);
            ws.onopen = () => {
                if (isAgentMode && token) {
                    ws.send(JSON.stringify({ type: 'register-agent-token', token: token, hostname: "PC-" + Math.floor(Math.random()*9000+1000) }));
                } else if (token) {
                    ws.send(JSON.stringify({ type: 'join-viewer', token: token }));
                }
            };

            ws.onmessage = async (event) => {
                const message = JSON.parse(event.data);

                if (message.type === 'joined-success') {
                    document.getElementById('status-top').innerText = 'Агент найден: ' + message.agentName;
                    document.getElementById('overlay-msg').innerText = 'Готово к подключению';
                    const mainBtn = document.getElementById('main-action-btn');
                    mainBtn.style.display = 'inline-block';
                    mainBtn.innerText = 'Подключить';
                    mainBtn.className = 'connect-btn';

                    if (sessionStorage.getItem('autoConnect') === 'true' && !isConnected) {
                        document.getElementById('overlay-msg').innerText = 'Установка соединения...';
                        setupPeer('viewer');
                        ws.send(JSON.stringify({ type: 'start-stream' }));
                        isConnected = true;
                        screenContainer.classList.add('hide-cursor');
                        localCursor.style.display = 'block';
                        mainBtn.innerText = 'Отключить';
                        mainBtn.className = 'disconnect-btn';
                        
                        const badge = document.getElementById('status-badge');
                        badge.innerText = 'Подключено';
                        badge.style.background = '#d4edda';
                        badge.style.color = '#155724';
                        badge.style.borderColor = '#c3e6cb';

                        startSessionTimer();
                    }
                }

                if (message.type === 'viewer-count') {
                    document.getElementById('viewerCount').innerText = `Смотрят: ${message.count}`;
                }

                if (message.type === 'start-stream' && isAgentMode) {
                    await startAgentSharing();
                }

                if (message.type === 'disconnected') {
                    resetInterface("Сессия завершена / разорвана");
                }

                if (message.type === 'signal') {
                    if (!pc) setupPeer(isAgentMode ? 'agent' : 'viewer');

                    if (message.payload.sdp) {
                        let sdp = message.payload.sdp;
                        
                        if (sdp.type === 'offer') {
                            await pc.setRemoteDescription(new RTCSessionDescription(sdp));
                            const answer = await pc.createAnswer();
                            
                            let sdpStr = answer.sdp;
                            if (sdpStr.includes('useInbandFEC=1')) {
                                sdpStr = sdpStr.replace(/a=fmtp:(\d+) (.*)/g, 'a=fmtp:$1 $2;x-google-max-bitrate=1500000;x-google-start-bitrate=800000');
                            }
                            const modifiedAnswer = new RTCSessionDescription({ type: 'answer', sdp: sdpStr });
                            await pc.setLocalDescription(modifiedAnswer);
                            ws.send(JSON.stringify({ type: 'signal', payload: { sdp: pc.localDescription } }));
                            return;
                        }

                        await pc.setRemoteDescription(new RTCSessionDescription(sdp));
                    } else if (message.payload.candidate) {
                        try {
                            await pc.addIceCandidate(new RTCIceCandidate(message.payload.candidate));
                        } catch (e) {
                            console.error('ICE error:', e);
                        }
                    }
                }
            };
        }

        function toggleConnection() {
            const mainBtn = document.getElementById('main-action-btn');
            const badge = document.getElementById('status-badge');

            if (!isConnected) {
                document.getElementById('overlay-msg').innerText = 'Установка соединения...';
                setupPeer('viewer');
                ws.send(JSON.stringify({ type: 'start-stream' }));
                isConnected = true;
                screenContainer.classList.add('hide-cursor');
                localCursor.style.display = 'block';
                sessionStorage.setItem('autoConnect', 'true');
                mainBtn.innerText = 'Отключить';
                mainBtn.className = 'disconnect-btn';
                
                badge.innerText = 'Подключено';
                badge.style.background = '#d4edda';
                badge.style.color = '#155724';
                badge.style.borderColor = '#c3e6cb';

                startSessionTimer();
            } else {
                disconnectSession();
            }
        }

        function disconnectSession() {
            sessionStorage.removeItem('autoConnect');
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'disconnect-session' }));
            }
            resetInterface("Соединение разорвано");
        }

        function resetInterface(msg) {
            isConnected = false;
            screenContainer.classList.remove('hide-cursor');
            sessionStorage.removeItem('autoConnect');
            stopSessionTimer();
            localCursor.style.display = 'none';
            
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            if (dataChannel) {
                dataChannel.close();
                dataChannel = null;
            }
            if (pc) {
                pc.close();
                pc = null;
            }

            remoteVideo.srcObject = null;
            document.getElementById('center-overlay').style.display = 'flex';
            document.getElementById('overlay-msg').innerText = msg;
            
            valBtn = document.getElementById('main-action-btn');
            valBtn.innerText = 'Подключить';
            valBtn.className = 'connect-btn';

            const badge = document.getElementById('status-badge');
            badge.innerText = 'Отключен';
            badge.style.background = '#f8d7da';
            badge.style.color = '#721c24';
            badge.style.borderColor = '#f5c6cb';
        }

        async function startAgentSharing() {
            try {
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                    localStream = null;
                }

                localStream = await navigator.mediaDevices.getDisplayMedia({ 
                    video: { 
                        cursor: "never",
                        width: { ideal: 1280, max: 1280 },
                        height: { ideal: 720, max: 720 },
                        frameRate: { ideal: 25, max: 30 }
                    }, 
                    audio: false 
                });

                document.getElementById('center-overlay').style.display = 'none';

                setupPeer('agent');
                
                dataChannel = pc.createDataChannel("input-channel", { ordered: false, maxRetransmits: 0 });
                dataChannel.onopen = () => console.log("DataChannel open on Agent!");

                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

                const offer = await pc.createOffer();
                
                let sdpStr = offer.sdp;
                if (sdpStr.includes('useInbandFEC=1')) {
                    sdpStr = sdpStr.replace(/a=fmtp:(\d+) (.*)/g, 'a=fmtp:$1 $2;x-google-max-bitrate=1500000;x-google-start-bitrate=800000');
                }
                const modifiedOffer = new RTCSessionDescription({ type: 'offer', sdp: sdpStr });

                await pc.setLocalDescription(modifiedOffer);
                ws.send(JSON.stringify({ type: 'signal', payload: { sdp: pc.localDescription } }));

                localStream.getVideoTracks()[0].onended = () => {
                    disconnectSession();
                };
            } catch (err) {
                console.error('Screen capture error:', err.message);
            }
        }

        function setupPeer(role) {
            if (pc) {
                pc.close();
                pc = null;
            }
            pc = new RTCPeerConnection(rtcConfig);

            if (role === 'viewer') {
                pc.ondatachannel = (event) => {
                    dataChannel = event.channel;
                    dataChannel.onopen = () => console.log("DataChannel open on Viewer!");
                };

                pc.ontrack = (event) => {
                    if (remoteVideo.srcObject !== event.streams[0]) {
                        remoteVideo.srcObject = event.streams[0];
                        
                        if (event.streams[0] && event.streams[0].getVideoTracks()[0]) {
                            const track = event.streams[0].getVideoTracks()[0];
                            if ('contentHint' in track) {
                                track.contentHint = 'motion';
                            }
                        }

                        document.getElementById('center-overlay').style.display = 'none';
                        document.getElementById('status-top').innerText = 'Трансляция активна';
                        
                        startSessionTimer();
                        
                        remoteVideo.play().catch(err => {
                            console.log("Autoplay blocked:", err);
                        });
                    }
                };
            }

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    ws.send(JSON.stringify({ type: 'signal', payload: { candidate: event.candidate } }));
                }
            };
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        init();
    </script>
</body>
</html>
